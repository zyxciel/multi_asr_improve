[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stage2-asr"
version = "0.1.0"
description = "Stage-2 multi-ASR + LLM fusion on diarizen_moss_fusion Mode-C outputs (mock-first)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pypinyin>=0.51",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
qwen = []
firered = []
llm = []

[project.scripts]
stage2-asr = "stage2_asr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stage2_asr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
